name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  # No schedule: every run starts from a commit (Dinis, 19 Nov 2026, about 01:20 UTC, main repo
  # board/guidance/2026-11-19-every-run-starts-from-a-commit.md). The pages load their changing figures in the
  # browser. workflow_dispatch is for a person by hand only.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The signature check's tests (the check itself runs in the security job, from the last verified commit)
        run: node tests/check-signatures.test.mjs
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The register tests (a hostile register, stubbed)
        run: node tests/generate.test.mjs
      - name: The leak scan's key rules (security@'s ruling, 19 Nov 2026)
        run: node tests/leak-scan.test.mjs
      - name: The built site, as data for the security job
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: _site
          retention-days: 1
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
  # The signature, trailer and leak checks run here, in a job that runs no pushed code: it checks the push out as data,
  # takes the checks from the last verified commit into RUNNER_TEMP and runs them with node by its absolute path, with
  # NODE_OPTIONS cleared and replace objects off. The built site reaches it only as an artifact. Deploy needs it
  # (security@'s control 9, ruling 16402a95c, 19 Nov 2026).
  security:
    needs: build
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # to read the anchor: the latest successful push run of this workflow on dev (security@'s ruling 0ba439611)
    env:
      GIT_NO_REPLACE_OBJECTS: '1'
      NODE_OPTIONS: ''
      # attributes are read from the empty tree, so no .gitattributes in the push (working tree or index) steers git's
      # diff or log; rm alone leaves the index copy in force (events.b@'s finding e774ff9, via conductor.b@, 19 Nov 16:25)
      GIT_ATTR_SOURCE: 4b825dc642cb6eb9a060e54bf8d69288fbee4904
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the build output is downloaded outside the checkout, vetted, and only then moved in: a pushed _site symlink can
      # point anywhere (the 16:08 AppSec review)
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: ${{ runner.temp }}/site-download
      # The anchor A is the newest commit a passing run verified, as GitHub itself records it: the head of the latest
      # successful push run of this workflow on dev, read with this run's own token (tags and deployments are not trusted). Every
      # security check below runs from A's tree, with A's config, never the pushed copy, and the range checked is A..AFTER,
      # so commits from dropped runs are covered. No A, no copy in A, or A not an ancestor of AFTER: the run fails
      # (security@'s rulings fae9649db, 3724c9ca2 and 948820a7e, 19 Nov 2026). The functional build uses the pushed tree.
      - name: Take the security checks from the last verified commit
        env:
          AFTER: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          unset NODE_OPTIONS; export GIT_NO_REPLACE_OBJECTS=1; export GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904
          # the pushed tree must not track _site, and the downloaded site holds plain files and directories only; both are
          # checked before any trusted file exists (events.b@; the 16:08 AppSec review)
          if [ -n "$(git ls-files -- _site)" ] || [ -L _site ] || [ -e _site ]; then echo "the push carries a _site path: not deploying" >&2; exit 1; fi
          DL="$RUNNER_TEMP/site-download"
          if [ ! -d "$DL" ] || [ -L "$DL" ] || [ -n "$(find "$DL" ! -type f ! -type d -print -quit)" ]; then echo "the built site is missing or holds a symlink or special file: not deploying" >&2; exit 1; fi
          mv "$DL" _site
          # GIT_ATTR_SOURCE needs git 2.42 or later; an older git would read the pushed attributes, so it stops the run
          GV=$(git version | sed -nE 's/^git version ([0-9]+\.[0-9]+).*/\1/p')
          if [ -z "$GV" ] || [ "$(printf '2.42\n%s\n' "$GV" | sort -V | head -n1)" != "2.42" ]; then echo "git ${GV:-unknown} is older than 2.42: pushed attributes cannot be turned off, not deploying" >&2; exit 1; fi
          # and it must hold here: no tracked file has any attribute set
          if [ -n "$(git ls-files -z | git check-attr --stdin -z -a 2>/dev/null | head -c 1)" ]; then echo "git still reads attributes from the push: not deploying" >&2; exit 1; fi
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then echo "shallow checkout: the checks need the whole history" >&2; exit 1; fi
          # A: the head commit of the latest successful push run of this workflow on dev. Only GitHub Actions creates runs;
          # a deployment can be made by anyone with write access (security@'s ruling 0ba439611, civic.b@'s finding).
          RUN=$(gh api "repos/$REPO/actions/workflows/pages.yml/runs?branch=dev&event=push&status=success&per_page=20" --jq '[.workflow_runs[] | select(.path == ".github/workflows/pages.yml" and .head_branch == "dev" and .event == "push" and .conclusion == "success")][0] | "\(.id) \(.head_sha)"' || true)
          RUN_ID=${RUN%% *}; A=${RUN#* }
          # that run must itself have run the security job and passed it, so a pushed workflow without it never becomes the
          # anchor (the 16:08 AppSec review; only branch protection fully closes a pushed rewrite of the workflow)
          if ! printf '%s' "$RUN_ID" | grep -Eq '^[0-9]+$' || [ "$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=50" --jq '[.jobs[] | select(.name == "security" and .conclusion == "success")] | length' || echo 0)" != "1" ]; then A=""; fi
          if ! printf '%s' "$A" | grep -Eq '^[0-9a-f]{40}$' || ! git cat-file -e "$A^{commit}" 2>/dev/null; then echo "no last verified commit (successful push run of this workflow on dev) to take the checks from: not deploying" >&2; exit 1; fi
          if ! git merge-base --is-ancestor "$A" "$AFTER"; then echo "the last verified commit is not an ancestor of this push (a force push): not deploying" >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/trusted"
          printf '%s\n' "$A" > "$RUNNER_TEMP/trusted/anchor"
          for f in check-signatures.mjs check-commits.mjs leak-scan.mjs; do
            git show "$A:scripts/$f" > "$RUNNER_TEMP/trusted/$f" 2>/dev/null || { echo "the last verified commit has no scripts/$f: not deploying" >&2; exit 1; }
          done
          # no symlink on any path the checks write or read as config (security@'s control 9)
          for p in scripts scripts/commit-exemptions.json scripts/leak-scan.trusted.mjs _site; do if [ -L "$p" ]; then echo "$p is a symlink: not deploying" >&2; exit 1; fi; done
          if [ -e scripts ] && [ ! -d scripts ]; then echo "scripts is not a directory: not deploying" >&2; exit 1; fi
          mkdir -p scripts
          # no pushed file is deleted or replaced before the leak scan, so the scan reads every pushed file (the 16:30 AppSec
          # review): attributes are off altogether (above); a pushed .gitignore can only hide untracked files, and the only
          # untracked paths here are the built site (walked by the scan itself) and the trusted copy below
          for c in .gitattributes .gitignore; do if [ -L "$c" ]; then echo "$c is a symlink: not deploying" >&2; exit 1; fi; done
          # the trailer check's config, A's exemptions or none, is kept aside and put in place after the leak scan
          if git cat-file -e "$A:scripts/commit-exemptions.json" 2>/dev/null; then git show "$A:scripts/commit-exemptions.json" > "$RUNNER_TEMP/trusted/commit-exemptions.json"; fi
          # the leak scan finds the repository from its own path, so its trusted copy sits in scripts/ for the run only
          cp "$RUNNER_TEMP/trusted/leak-scan.mjs" scripts/leak-scan.trusted.mjs
      - name: Leak scan (tracked files as pushed, and the built site; the trusted copy)
        run: |
          unset NODE_OPTIONS; export GIT_NO_REPLACE_OBJECTS=1; export GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904; NODE_BIN="$(command -v node)"; case "$NODE_BIN" in /*) ;; *) exit 1 ;; esac
          "$NODE_BIN" scripts/leak-scan.trusted.mjs
      - name: Every commit from the last verified commit carries an Agent trailer (the trusted check)
        env:
          AFTER: ${{ github.sha }}
        run: |
          unset NODE_OPTIONS; export GIT_NO_REPLACE_OBJECTS=1; export GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904; NODE_BIN="$(command -v node)"; case "$NODE_BIN" in /*) ;; *) exit 1 ;; esac
          # after the leak scan, the pushed exemptions give way to A's, or to none
          if [ -L scripts/commit-exemptions.json ]; then echo "scripts/commit-exemptions.json is a symlink: not deploying" >&2; exit 1; fi
          if [ -f "$RUNNER_TEMP/trusted/commit-exemptions.json" ]; then cp "$RUNNER_TEMP/trusted/commit-exemptions.json" scripts/commit-exemptions.json; else rm -f scripts/commit-exemptions.json; fi
          "$NODE_BIN" "$RUNNER_TEMP/trusted/check-commits.mjs" "$(cat "$RUNNER_TEMP/trusted/anchor")" "$AFTER"
      - name: Signed commits (every commit after the pinned base; the trusted check)
        env:
          AFTER: ${{ github.sha }}
        run: |
          unset NODE_OPTIONS; export GIT_NO_REPLACE_OBJECTS=1; export GIT_ATTR_SOURCE=4b825dc642cb6eb9a060e54bf8d69288fbee4904; NODE_BIN="$(command -v node)"; case "$NODE_BIN" in /*) ;; *) exit 1 ;; esac
          "$NODE_BIN" "$RUNNER_TEMP/trusted/check-signatures.mjs" "" "$AFTER"
      # the deployed bytes are the scanned bytes: the Pages artifact is made here, from the site this job scanned (library.b@)
      - if: needs.build.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: [build, security]
    if: github.ref == 'refs/heads/dev' && needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, security, deploy]
    if: ${{ always() && github.ref == 'refs/heads/dev' && needs.build.result == 'success' && needs.security.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
