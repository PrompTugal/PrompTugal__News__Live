name: Pages
# From the site repositories made by sites@AgentiCCells.dinis (2026-11-16). In the
# template itself (.factory-template exists) nothing is deployed: it is built,
# checked and versioned only. A seeded site deploys on every push to dev.
on:
  push:
    branches: [dev]
  workflow_dispatch:
  # No schedule: every run starts from a commit (Dinis, 19 Nov 2026, about 01:20 UTC, main repo
  # board/guidance/2026-11-19-every-run-starts-from-a-commit.md). The pages load their changing figures in the
  # browser. workflow_dispatch is for a person by hand only.
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
env:
  # Major and minor are set here by a person. The patch number is set by this workflow only:
  # the first release is v0.1.0, and each later push to dev adds one.
  VERSION_BASE: '0.1'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.version.outputs.version }}
      deploy: ${{ steps.mode.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: No release during a hold
        run: if [ -e board/HOLD.md ]; then echo "board/HOLD.md exists" >&2; exit 1; fi
      - id: version
        name: Work out the next version from the tags
        run: |
          last=$(git tag --list "v${VERSION_BASE}.*" | sed "s/^v${VERSION_BASE}\.//" | grep -E '^[0-9]+$' | sort -n | tail -1 || true)
          if [ -z "$last" ]; then next=0; else next=$((last + 1)); fi
          echo "version=v${VERSION_BASE}.${next}" >> "$GITHUB_OUTPUT"
          echo "Version: v${VERSION_BASE}.${next}"
      - id: mode
        name: Deploy unless this is the template itself
        run: if [ -e .factory-template ]; then echo deploy=false >> "$GITHUB_OUTPUT"; else echo deploy=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Every security check below runs as the previous head of dev (github.event.before) had it, with that head's config,
      # never the pushed copy; if that head lacks any of them, the run fails (security@'s control 7, widened, 19 Nov 2026:
      # fae9649db). The functional build may use the pushed tree.
      - name: Take the security checks from the previous head of dev
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" != "false" ]; then echo "shallow checkout: the checks need the whole history" >&2; exit 1; fi
          if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then echo "no previous head of dev to take the checks from: not deploying" >&2; exit 1; fi
          mkdir -p "$RUNNER_TEMP/trusted"
          for f in check-signatures.mjs check-commits.mjs leak-scan.mjs; do
            git show "$BEFORE:scripts/$f" > "$RUNNER_TEMP/trusted/$f" 2>/dev/null || { echo "the previous head of dev has no scripts/$f: not deploying" >&2; exit 1; }
          done
          # the trailer check's config: the previous head's exemptions, or none
          if git cat-file -e "$BEFORE:scripts/commit-exemptions.json" 2>/dev/null; then git show "$BEFORE:scripts/commit-exemptions.json" > scripts/commit-exemptions.json; else rm -f scripts/commit-exemptions.json; fi
          # the leak scan finds the repository from its own path, so its trusted copy sits in scripts/ for the run only
          cp "$RUNNER_TEMP/trusted/leak-scan.mjs" scripts/leak-scan.trusted.mjs
      - name: Every commit since the last release carries an Agent trailer (the trusted check)
        # Range: from the last release tag (or the push's base if none) to the new head. The tag, not github.event.before:
        # a newer push cancels a queued run (concurrency), and the surviving run's "before" is the dropped push's head, so the
        # dropped push's commits were never checked (specialist.code@ finding 3b).
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          last=$(git describe --tags --abbrev=0 --match "v${VERSION_BASE}.*" "$AFTER" 2>/dev/null || true)
          node "$RUNNER_TEMP/trusted/check-commits.mjs" "${last:-$BEFORE}" "$AFTER"
      - name: Signed commits (every commit after the pinned base, the trusted check)
        env:
          AFTER: ${{ github.sha }}
        run: |
          node tests/check-signatures.test.mjs
          node "$RUNNER_TEMP/trusted/check-signatures.mjs" "" "$AFTER"
      - run: node scripts/build.mjs
        env:
          SITE_VERSION: ${{ steps.version.outputs.version }}
      - run: node scripts/validate.mjs
      - name: The register tests (a hostile register, stubbed)
        run: node tests/generate.test.mjs
      - name: The leak scan's key rules (security@'s ruling, 19 Nov 2026)
        run: node tests/leak-scan.test.mjs
      - name: Leak scan (tracked files and the built site; the trusted copy)
        run: node scripts/leak-scan.trusted.mjs
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/configure-pages@v5
      - if: steps.mode.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  tag:
    needs: [build, deploy]
    if: ${{ always() && needs.build.result == 'success' && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag the released commit
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
